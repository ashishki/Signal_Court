name: CI

on:
  push:
    branches: ["master", "main"]

permissions:
  contents: read
  pull_request:
    branches: ["master", "main"]

jobs:
  test:
    name: Tests + Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: pip install -r requirements-lock.txt -e .

      - name: Validate dependency graph
        run: python -m pip check

      - name: Lint
        run: ruff check app/ tests/ scripts/*.py

      - name: Format check
        run: ruff format --check app/ tests/ scripts/*.py

      - name: Run tests
        env:
          SIGNAL_COUNT_ENV: "test"
          LLM_API_KEY: "test-key"
          # Use GitHub Actions secrets for real credentials:
          # LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python -m pytest tests/ -q --tb=short

      - name: Reproduce public evidence bundle
        run: python scripts/build_public_evidence.py --verify evidence/public-fixture-v1
