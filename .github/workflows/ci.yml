name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

permissions:
  contents: read

jobs:
  test:
    name: Tests + Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-lock.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Validate dependency graph
        run: python -m pip check

      - name: Lint
        run: ruff check app/ tests/ scripts/*.py

      - name: Format check
        run: ruff format --check app/ tests/ scripts/*.py

      - name: Run tests
        env:
          SIGNAL_COUNT_ENV: "test"
          LLM_API_KEY: "test-key"
          # Use GitHub Actions secrets for real credentials:
          # LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python -m pytest tests/ -q --tb=short

      - name: Reproduce public evidence bundle
        run: python scripts/build_public_evidence.py --verify evidence/public-fixture-v1
