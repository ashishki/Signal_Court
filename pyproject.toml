[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-count"
version = "0.1.0"
description = "AXL-powered analyst swarm for auditable market thesis risk memos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.139.0",
    "starlette==1.3.1",
    "uvicorn==0.51.0",
    "pydantic==2.13.4",
    "eth-account==0.13.7",
]

[tool.setuptools.packages.find]
include = ["app*", "mcp_routing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
